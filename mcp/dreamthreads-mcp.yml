tools:
  - name: parse_dream
    title: Parse dream context
    description: >-
      Extract structured entities, actions, emotions, agency, threat, outcome, sensory cues, and
      recurrence from one dream narrative. Bounded: no fixed meaning, diagnosis or prediction, and
      no dream text storage.
    input_schema:
      required: [text]
      properties:
        text: string, 1-6000 characters
        recurrence: optional boolean or string (max 80 chars)
    annotations:
      readOnlyHint: true
      destructiveHint: false
      idempotentHint: true
      openWorldHint: false
    source_operation: openapi/dreamthreads-dreamgraph-openapi.yml#parseDreamPublicly
  - name: search_dream_concepts
    title: Search DreamGraph concepts
    description: >-
      Search DreamGraph's stable, context-first vocabulary for a dream element or experience.
      Results are descriptive concepts, not universal symbolic definitions.
    input_schema:
      required: [query]
      properties:
        query: string, 2-100 characters
        limit: integer 1-12, default 8
    annotations:
      readOnlyHint: true
      destructiveHint: false
      idempotentHint: true
      openWorldHint: false
    source_operation: null
