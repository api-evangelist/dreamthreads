name: DreamThreads
description: >-
  DreamThreads exposes the DreamGraph API, a context-first dream interpretation and structured parsing platform. It
  offers a keyless public dream parser, gated partner interpretation endpoints, a hosted MCP server, and full
  machine-readable contracts. Interpretations are framed as reflective, not diagnostic or predictive.
