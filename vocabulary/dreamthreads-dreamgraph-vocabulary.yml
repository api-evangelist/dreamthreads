name: DreamGraph concept vocabulary
description: >-
  DreamGraph is DreamThreads' controlled, context-first vocabulary of dream elements. Every concept
  carries a stable id, a slug, a human name, a TYPE that classifies what kind of dream element it is,
  a one-line descriptive gloss, and a canonical URL. The provider frames these as descriptive
  concepts, explicitly NOT universal symbolic definitions, which is the whole editorial premise of
  the product.
harvest:
  how: >-
    There is no list-all endpoint and no published vocabulary file. The vocabulary was enumerated by
    calling the provider's own anonymous MCP tool `search_dream_concepts` (limit 12) across 85 dream
    terms on 2026-08-14 and deduplicating the returned concept records. Every entry below is a
    verbatim provider-returned record — none was authored here.
  queries_issued: 85
  concepts_discovered: 49
  completeness: unknown
  completeness_note: >-
    A sampling harvest cannot prove coverage. 49 concepts is a floor, not a total: any concept no
    query happened to match is absent from this file. Recording the floor honestly is the point.
discoverability_finding: >-
  Each concept has a live canonical page at https://mydreamthreads.xyz/dreamgraph/<slug> (probed
  /dreamgraph/snake -> HTTP 200), but there is NO index page (/dreamgraph -> HTTP 404) and none of
  the 49 concept URLs appear in https://mydreamthreads.xyz/sitemap.xml, which lists 30 URLs and
  covers only the 17 editorial /dream-meaning guides. The machine vocabulary and the human library
  are therefore two disjoint surfaces, and the machine one is unlinked and uncrawlable.
